# PostgreSQL 测试容器的 pg_hba.conf(docker-compose.test.yml 用 hba_file 指过来)。
# 和官方镜像默认的一样,只多了一条:basalt_cert 只能经 SSL 用客户端证书登录(角色由 SSL 集成测试自己建)。
# 按第一条匹配的规则走,所以证书那条放在通用规则前面。
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
hostssl all             basalt_cert     all                     cert
host    all             all             all                     scram-sha-256
