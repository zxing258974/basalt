[workspace]
resolver = "3"
members = ["crates/basalt-core", "src-tauri"]
# vendor/ 下是打了补丁的第三方 crate,不当作本项目的成员(不跑它们的 fmt / clippy)。
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
basalt-core = { path = "crates/basalt-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
# 钉死 0.8.6:下面 [patch.crates-io] 的 sqlx-core 副本只对 0.8.6 生效,升别的版本会悄悄绕过补丁。
sqlx = { version = "=0.8.6", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "mysql",
  "postgres",
  "sqlite",
  "chrono",
  "rust_decimal",
  "uuid",
  "json",
] }
chrono = { version = "0.4", features = ["serde"] }
# 本机的 IANA 时区名(PG 会话按本机时区显示);macOS 读系统设置,Windows 从系统时区换算
iana-time-zone = "0.1"
rust_decimal = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# 密码存储:macOS 钥匙串,Windows 凭据管理器(各自只在对应平台上编译)
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# SQL 助手:请求用户自己配置的大模型(OpenAI / Claude 格式,流式)。rustls + 系统根证书,读 macOS 系统代理
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2", "macos-system-configuration"] }
# 删连接时不弹框地删钥匙串条目:keyring 删除前会先读出密码,读密码就要授权
core-foundation = "0.10"
security-framework-sys = "2.17"
tempfile = "3"
log = "0.4"
futures-util = "0.3"
# 导入 Navicat 连接:conn.plist、.ncx(XML)与其中 AES-128-CBC 加密的密码
plist = "1.10"
quick-xml = "0.42"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
# 导入导出:xlsx 写(常量内存模式,行数再多内存也不涨)、xlsx / xls 读、GBK 编码、Base64
rust_xlsxwriter = { version = "0.100", features = ["constant_memory"] }
calamine = { version = "0.37", features = ["dates"] }
encoding_rs = "0.8"
base64 = "0.22"
# SSH 隧道:纯 Rust;关掉默认的 aws-lc-rs(要 cmake 编 C 库),加密后端用 sqlx / rustls 已经在用的 ring
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }

# sqlx-core 0.8.6 的 TLS 套接字在「读写都被阻塞」时先等写就绪、再等读就绪,大包写到一半偶发和服务器互等卡死
# (MySQL / MariaDB / PostgreSQL 开了 TLS 时导入整批 INSERT 可能碰上)。sqlx 0.9.0 修了,0.8 没有补丁版本,
# 这里用打了同样修复的副本,详见 vendor/README.md。升级到 sqlx 0.9 后删掉这一节和 vendor/sqlx-core。
[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core" }

# 调试信息只给自己的代码留行号(报错、panic 的回溯照样有文件和行号),依赖不带。
# 每个集成测试都是一个静态链着 sqlx、tauri、russh 的独立程序,带全量调试信息时一个几百 MB,
# 编译目录几天就能涨到几十 GB。要单步调试某个依赖时,临时把下面那节注释掉。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
