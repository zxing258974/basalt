[package]
name = "basalt"
description = "Basalt 桌面数据库客户端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "basalt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile.workspace = true
sqlx.workspace = true
# 用 mock 运行时测退出前确认(quit.rs);tauri-runtime 用来构造窗口事件。
tauri = { version = "2.12.4", features = ["test"] }
tauri-runtime = "2.12.2"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
basalt-core.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

# macOS:给应用代理补上 applicationShouldTerminate:(从程序坞退出、关机时问一声,见 src/quit.rs);和 tao 用的同一版
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Windows:启动时关掉 WebView2 的浏览器快捷键(见 src/webview_windows.rs);版本跟 tauri / wry 用的一致
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
