[workspace]
resolver = "3"
members = ["crates/basalt-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
basalt-core = { path = "crates/basalt-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "mysql",
  "postgres",
  "sqlite",
  "chrono",
  "rust_decimal",
  "uuid",
  "json",
] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["apple-native"] }
# 删连接时不弹框地删钥匙串条目:keyring 删除前会先读出密码,读密码就要授权
core-foundation = "0.10"
security-framework-sys = "2.17"
tempfile = "3"
log = "0.4"
futures-util = "0.3"
# 导入 Navicat 连接:conn.plist、.ncx(XML)与其中 AES-128-CBC 加密的密码
plist = "1.10"
quick-xml = "0.42"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
# 导入导出:xlsx 写(常量内存模式,行数再多内存也不涨)、xlsx / xls 读、GBK 编码、Base64
rust_xlsxwriter = { version = "0.100", features = ["constant_memory"] }
calamine = { version = "0.37", features = ["dates"] }
encoding_rs = "0.8"
base64 = "0.22"
